e" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="38" y="161">1 ページ分</text></g></g></g><g data-cell-id="c9"><g><rect x="201" y="64" width="160" height="124" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c10"><g><rect x="223" y="84" width="116" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="223" y="106">絞り込み</text></g></g></g><g data-cell-id="c11"><g><rect x="223" y="116" width="116" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="223" y="135">検索、フィルター</text></g></g></g><g data-cell-id="c12"><g><rect x="386" y="64" width="160" height="124" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c13"><g><rect x="408" y="84" width="116" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="408" y="106">並べ替え</text></g></g></g><g data-cell-id="c14"><g><rect x="408" y="116" width="116" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="408" y="135">1 列。昇順、</text></g></g></g><g data-cell-id="c15"><g><rect x="408" y="142" width="116" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="408" y="161">降順、解除</text></g></g></g><g data-cell-id="c16"><g><rect x="571" y="64" width="160" height="124" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c17"><g><rect x="593" y="84" width="116" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="593" y="106">ページ送り</text></g></g></g><g data-cell-id="c18"><g><rect x="593" y="116" width="116" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="593" y="135">50 件ずつ</text></g></g></g><g data-cell-id="c19"><g><rect x="756" y="64" width="160" height="124" rx="14" ry="14" fill="#ddf4ff" stroke="none" pointer-events="all" style="fill: rgb(18, 29, 47);"/></g></g><g data-cell-id="c20"><g><rect x="778" y="84" width="116" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="778" y="106">表示する行</text></g></g></g><g data-cell-id="c21"><g><rect x="778" y="116" width="116" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="778" y="135">表に描画する</text></g></g></g><g data-cell-id="c22"><g><path d="M 179 126 L 187.82 126" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 196.32 126 L 187.82 128.83 L 187.82 123.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c23"><g><path d=