 font-size="15px" style="fill: rgb(145, 152, 161);"><text x="371" y="154">自動で更新</text></g></g></g><g data-cell-id="c8"><g><rect x="284" y="157" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="371" y="176">できるか</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="536" y="72" width="220" height="142" rx="12" ry="12" fill="none" stroke="#b45309" stroke-width="1.2" pointer-events="all" style="stroke: rgb(210, 153, 34);"/></g></g><g data-cell-id="c10"><g><rect x="544" y="87" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="646" y="107">再認証の画面</text></g></g></g><g data-cell-id="c11"><g><rect x="544" y="113" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="646" y="132">機密のデータを表示しない</text></g></g></g><g data-cell-id="c12"><g><rect x="544" y="135" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="646" y="154">入力はメモリに保持</text></g></g></g><g data-cell-id="c13"><g><rect x="544" y="157" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="646" y="176">保存中の処理は</text></g></g></g><g data-cell-id="c14"><g><rect x="544" y="179" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style=