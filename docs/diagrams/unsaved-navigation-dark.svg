ke-width="1.5" pointer-events="all" style="fill: rgb(13, 17, 23); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c14"><g><rect x="40" y="204" width="400" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="40" y="226">Alert Dialog</text></g></g></g><g data-cell-id="c15"><g><rect x="40" y="234" width="400" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="253">「変更を破棄しますか？」</text></g></g></g><g data-cell-id="c16"><g transform="translate(0.5,0.5)"><rect x="40" y="278" width="492" height="76" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c17"><g><rect x="62" y="293" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="62" y="313">編集を続ける</text></g></g></g><g data-cell-id="c18"><g><rect x="62" y="319" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="62" y="338">初期フォーカス、Escape</text></g></g></g><g data-cell-id="c19"><g><path d="M 538 316 L 619.82 316" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 628.32 316 L 619.82 318.83 L 619.82 313.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c20"><g><rect x="636" y="278" width="280" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c21"><g><rect x="644" y="304" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="776" y="324">留まる</text></g></g></g><g data-cell-id="c22"><g><rect x="40" y="370" width="492" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c23"><g><rect x="62" y="396" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="62" y="416">変更を破棄</text></g></g></g><g data-cell-id="c24"><g><rect x="62" y="422" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="62" y="441">現在の変更を捨てる</text></g></g></g><g data-cell-id="c25"><g><path d="M 538 419 L 619.82 419" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 628.32 419 L 619.82 421.83 L 619.82 416.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c26"><g><rect x="636" y="370" width="280" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c27"><g><rect x="644" y="385" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="776" y="405">移動</text></g></g></g><g data-cell-id="c28"><g><rect x="644" y="411" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="776" y="430">この移動の処理の間だけ確認しない</text></g></g></g><g data-cell-id="c29"><g><rect x="644" y="433" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="776" y="452">新しい変更は確認の対象</text></g></g></g><g data-cell-id="c30"><g><rect x="40" y="484" width="492" height="120" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c31"><g><rect x="62" y="499" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="62" y="519">保存して移動</text></g></g></g><g data-cell-id="c32"><g><rect x="62" y="525" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="62" y="544">すべて保存できる場合だけ表示する</text></g></g></g><g data-cell-id="c33"><g><rect x="62" y="547" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="62" y="566">1 つでも失敗したら残りを保存せずに止め、留まる</text></g></g></g><g data-cell-id="c34"><g><rect x="62" y="569" width="448" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="62" y="588">保存の間に新しい入力があれば、移動せずにもう一度確かめる</text></g></g></g><g data-cell-id="c35"><g><path d="M 538 544 L 619.82 544" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 628.32 544 L 619.82 546.83 L 619.82 541.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c36"><g><rect x="636" y="484" width="280" height="120" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c37"><g><rect x="644" y="521" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="776" y="541">成功：移動する</text></g></g></g><g data-cell-id="c38"><g><rect x="644" y="547" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="776" y="566">失敗：留まり、入力を残す</text></g></g></g><g data-cell-id="c39"><g><rect x="16" y="664" width="83" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="16" y="683">ほかの移動</text></g></g></g><g data-cell-id="c40"><g><rect x="16" y="692" width="260" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c41"><g><rect x="24" y="718" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"