<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1012px" height="571px" viewBox="0 0 1012 571"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="600" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="16" y="36">閲覧の状態（通知の read）</text></g></g></g><g data-cell-id="c2"><g><rect x="16" y="42" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="16" y="61">通知センターと一覧で変わる。開いただけ（通知センターを開く）では変えない</text></g></g></g><g data-cell-id="c3"><g><rect x="76" y="86" width="200" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c4"><g><rect x="84" y="101" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="176" y="121">未読</text></g></g></g><g data-cell-id="c5"><g><rect x="84" y="127" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="176" y="146">Dot、太字、「未読、」</text></g></g></g><g data-cell-id="c6"><g><rect x="576" y="86" width="200" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c7"><g><rect x="584" y="101" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="676" y="121">既読</text></g></g></g><g data-cell-id="c8"><g><rect x="584" y="127" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="676" y="146">表示を通常に戻す</text></g></g></g><g data-cell-id="c9"><g><path d="M 282 110 L 559.82 110" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 568.32 110 L 559.82 112.83 L 559.82 107.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c10"><g><rect x="286" y="68" width="280" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="426" y="86">個別の通知を開く、既読にする、</text></g></g></g><g data-cell-id="c11"><g><rect x="286" y="87" width="280" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="426" y="105">すべて既読にする（明示的な操作）</text></g></g></g><g data-cell-id="c12"><g><path d="M 570 142 L 292.18 142" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 283.68 142 L 292.18 139.17 L 292.18 144.83 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c13"><g><rect x="326" y="148" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="426" y="166">未読に戻す</text></g></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><rect x="816" y="86" width="160" height="76" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c15"><g><rect x="824" y="101" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="896" y="121">削除・非表示</text></g></g></g><g data-cell-id="c16"><g><rect x="824" y="127" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="896" y="146">通知だけを消す</text></g></g></g><g data-cell-id="c17"><g transform="translate(0.5,0.5)"><path d="M 16 218 L 976 218" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-miterlimit="10" stroke-dasharray="3.6 3.6" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c18"><g><rect x="186" y="201" width="620" height="34" rx="14" ry="14" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="c19"><g><rect x="186" y="208" width="620" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(9, 105, 218);"><text x="496" y="227">独立して管理する（一方を変えても、もう一方は変えない）</text></g></g></g><g data-cell-id="c20"><g><rect x="16" y="268" width="600" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="16" y="288">業務の対応の状態（業務のデータの task）</text></g></g></g><g data-cell-id="c21"><g><rect x="16" y="294" width="700" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="16" y="313">対象の画面（顧客、処理の結果）で変わる。通知の既読、削除では変えない</text></g></g></g><g data-cell-id="c22"><g><rect x="76" y="338" width="200" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c23"><g><rect x="84" y="353" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="176" y="373">対応待ち</text></g></g></g><g data-cell-id="c24"><g><rect x="84" y="379" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="176" y="398">例：担当の割り当て</text></g></g></g><g data-cell-id="c25"><g><rect x="576" y="338" width="200" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c26"><g><rect x="584" y="353" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="676" y="373">対応完了</text></g></g></g><g data-cell-id="c27"><g><rect x="584" y="379" width="184" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="676" y="398">例：顧客に連絡した</text></g></g></g><g data-cell-id="c28"><g><rect x="816" y="338" width="160" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c29"><g><rect x="824" y="353" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="896" y="373">対応なし</text></g></g></g><g data-cell-id="c30"><g><rect x="824" y="379" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="896" y="398">お知らせだけ</text></g></g></g><g data-cell-id="c31"><g><path d="M 282 376 L 559.82 376" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 568.32 376 L 559.82 378.83 L 559.82 373.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c32"><g><rect x="286" y="350" width="280" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="426" y="368">対象の画面で業務を完了する</text></g></g></g><g data-cell-id="c33"><g><rect x="16" y="454" width="960" height="84" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c34"><g><rect x="40" y="470" width="912" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="40" y="489">既読にしても業務は完了しない。業務を完了しても、通知を既読にすることは製品が決める</text></g></g></g><g data-cell-id="c35"><g><rect x="40" y="498" width="912" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="40" y="517">通知を削除・非表示にしても、元の業務のデータ（対応待ちの件数など）を変えない</text></g></g></g></g></g></g></svg>