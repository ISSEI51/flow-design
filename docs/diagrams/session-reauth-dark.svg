/><path d="M 646 286.32 L 643.17 277.82 L 648.83 277.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c41"><g><rect x="16" y="476" width="1000" height="56" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c42"><g><rect x="40" y="493" width="940" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="512">保存の途中で切れた場合は、結果を確かめる前に再送信しない</text></g></g></g><g data-cell-id="c43"><g><rect x="16" y="314" width="480" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="16" y="333">再認証の後の扱い</text></g></g></g><g data-cell-id="c44"><g><rect x="16" y="340" width="480" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="16" y="359">planReauthentication で、同じ利用者か</text></g></g></g><g data-cell-id="c45"><g><rect x="16" y="362" width="480" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="16" y="381">別の利用者かを判定する</text></g></g></g></g></g></g></svg>