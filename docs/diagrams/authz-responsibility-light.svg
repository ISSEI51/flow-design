ont-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="698" y="214">古いスコープの権限を反映しない</text></g></g></g><g data-cell-id="c28"><g><rect x="291" y="97" width="60" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="321" y="115">要求</text></g></g></g><g data-cell-id="c29"><g><rect x="621" y="97" width="60" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="651" y="115">応答</text></g></g></g><g data-cell-id="c30"><g transform="translate(0.5,0.5)"><rect x="16" y="336" width="280" height="76" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c31"><g><rect x="34" y="350" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="34" y="369">UI を経由しない要求</text></g></g></g><g data-cell-id="c32"><g><rect x="34" y="376" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="34" y="394">URL、リクエスト、ID の改変</text></g></g></g><g data-cell-id="c33"><g><path d="M 302 374 L 476 374 Q 486 374 486 364 L 486 282.18" fill="none" stroke="#b45309" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(180, 83, 9);"/><path d="M 486 273.68 L 488.83 282.18 L 483.17 282.18 Z" fill="#b45309" stroke="#b45309" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g data-cell-id="c34"><g><rect x="500" y="350" width="290" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="500" y="369">バックエンドが拒否する</text></g></g></g><g data-cell-id="c35"><g><rect x="500" y="376" width="290" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="500" y="394">UI の制限に依存しない</text></g></g></g><g data-cell-id="c36"><g><rect x="16" y="452" width="940" height="92" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c37"><g><rect x="40" y="468" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 35, 40);"><text x="40" y="490">UI の非表示と無効化は、認可の代わりにならない</text></g></g></g><g data-cell-id="c38"><g><rect x="40" y="502" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="40" y="521">ロールと権限の定義（RBAC、ABAC）、権限の変更の検知、セッションの管理は製品の責務</text></g></g></g></g></g></g></svg>