" y="116">届いたことを</text></g></g></g><g data-cell-id="c16"><g><rect x="576" y="119" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="648" y="138">確認できる場合</text></g></g></g><g data-cell-id="c17"><g><rect x="752" y="56" width="160" height="98" rx="12" ry="12" fill="#ddf4ff" stroke="none" pointer-events="all" style="fill: rgb(18, 29, 47);"/></g></g><g data-cell-id="c18"><g><rect x="760" y="71" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="832" y="91">既読</text></g></g></g><g data-cell-id="c19"><g><rect x="760" y="97" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="832" y="116">アプリ内で開く、</text></g></g></g><g data-cell-id="c20"><g><rect x="760" y="119" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="832" y="138">既読にする</text></g></g></g><g data-cell-id="c21"><g><rect x="936" y="56" width="160" height="98" rx="12" ry="12" fill="#ddf4ff" stroke="none" pointer-events="all" style="fill: rgb(18, 29, 47);"/></g></g><g data-cell-id="c22"><g><rect x="944" y="71" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="1016" y="91">対応完了</text></g></g></g><g data-cell-id="c23"><g><rect x="944" y="97" width="144" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-