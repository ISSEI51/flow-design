<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="951px" height="910px" viewBox="0 0 951 910"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="290" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c2"><g><rect x="32" y="53" width="258" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="161" y="75">権限は確定しているか</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="416" y="16" width="500" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" pointer-events="all" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c4"><g><rect x="424" y="31" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="666" y="51">確定するまで操作を許可しない</text></g></g></g><g data-cell-id="c5"><g><rect x="424" y="57" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="76">業務の操作：無効にして「確認しています」</text></g></g></g><g data-cell-id="c6"><g><rect x="424" y="79" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="98">管理の機能：確定するまで表示しない</text></g></g></g><g data-cell-id="c7"><g><path d="M 312 65 L 399.82 65" fill="none" stroke="#8c959f" stroke-width="1.5" s