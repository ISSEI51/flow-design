<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="991px" height="734px" viewBox="0 0 991 734"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 35, 40);"><text x="16" y="38">即時保存</text></g></g></g><g data-cell-id="c2"><g><rect x="16" y="44" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="16" y="63">独立した低リスクの設定（表示言語、個人の通知）</text></g></g></g><g data-cell-id="c3"><g><rect x="506" y="16" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 35, 40);"><text x="506" y="38">明示的な保存</text></g></g></g><g data-cell-id="c4"><g><rect x="506" y="44" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="506" y="63">依存し合う項目、影響の大きい設定（プロフィール）</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="16" y="86" width="450" height="44" rx="10" ry="10" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c6"><g><rect x="32" y="98" width="170" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="32" y="116">通知を止める時間帯</text></g></g></g><g data-cell-id="c7"><g><rect x="206" y="98" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(9, 105, 218);"><text x="206" y="115">保存の単位</text></g></g></g><g data-cell-id="c8"><g><rect x="414" y="98" width="34" height="20" rx="10" ry="10" fill="#0969da" stroke="none" pointer-events="all" style="fill: rgb(9, 105, 218);"/></g></g><g data-cell-id="c9"><g><ellipse cx="438" cy="108" rx="7" ry="7" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(255, 255, 255);"/></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="16" y="138" width="450" height="44" rx="10" ry="10" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c11"><g><rect x="32" y="150" width="170" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="32" y="168">表示言語</text></g></g></g><g data-cell-id="c12"><g><rect x="206" y="150" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(9, 105, 218);"><text x="206" y="167">保存の単位</text></g></g></g><g data-cell-id="c13"><g transform="translate(0.5,0.5)"><rect x="310" y="146" width="140" height="28" rx="8" ry="8" fill="#ffffff" stroke="#8c959f" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c14"><g><rect x="322" y="146" width="116" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(89, 99, 110);"><text x="322" y="165.5">日本語</text></g></g></g><g data-cell-id="c15"><g transform="translate(0.5,0.5)"><path d="M 427 158 L 429.5 160.5 Q 432 163 434.5 160.5 L 437 158" fill="none" stroke="#57606a" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 96, 106);"/></g></g><g data-cell-id="c16"><g transform="translate(0.5,0.5)"><rect x="16" y="190" width="450" height="44" rx="10" ry="10" fill="#ffffff" stroke="#8c959f" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c17"><g><rect x="32" y="202" width="170" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="32" y="220">タイムゾーン</text></g></g></g><g data-cell-id="c18"><g><rect x="206" y="202" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(9, 105, 218);"><text x="206" y="219">保存の単位</text></g></g></g><g data-cell-id="c19"><g transform="translate(0.5,0.5)"><rect x="310" y="198" width="140" height="28" rx="8" ry="8" fill="#ffffff" stroke="#8c959f" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c20"><g><rect x="322" y="198" width="116" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(89, 99, 110);"><text x="322" y="217.5">日本（東京）</text></g></g></g><g data-cell-id="c21"><g transform="translate(0.5,0.5)"><path d="M 427 210 L 429.5 212.5 Q 432 215 434.5 212.5 L 437 210" fill="none" stroke="#57606a" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 96, 106);"/></g></g><g data-cell-id="c22"><g transform="translate(0.5,0.5)"><rect x="506" y="86" width="450" height="148" rx="10" ry="10" fill="#ffffff" stroke="#0969da" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(9, 105, 218);"/></g></g><g data-cell-id="c23"><g><rect x="522" y="96" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(9, 105, 218);"><text x="522" y="113">保存の単位（フォーム）</text></g></g></g><g data-cell-id="c24"><g transform="translate(0.5,0.5)"><rect x="522" y="120" width="418" height="32" rx="8" ry="8" fill="#ffffff" stroke="#8c959f" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c25"><g><rect x="534" y="120" width="394" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="534" y="142">表示名</text></g></g></g><g data-cell-id="c26"><g transform="translate(0.5,0.5)"><rect x="522" y="160" width="418" height="32" rx="8" ry="8" fill="#ffffff" stroke="#8c959f" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c27"><g><rect x="534" y="160" width="394" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="534" y="182">役職</text></g></g></g><g data-cell-id="c28"><g><rect x="522" y="200" width="150" height="26" rx="8" ry="8" fill="#0969da" stroke="none" pointer-events="all" style="fill: rgb(9, 105, 218);"/></g></g><g data-cell-id="c29"><g><rect x="522" y="200" width="150" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(255, 255, 255);"><text x="597" y="218.5">プロフィールを保存</text></g></g></g><g data-cell-id="c30"><g><rect x="686" y="203" width="250" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(89, 99, 110);"><text x="686" y="220">保存していない変更があります</text></g></g></g><g data-cell-id="c31"><g><rect x="16" y="266" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="16" y="284">変更した時点で保存し、項目の下に状態を示す</text></g></g></g><g data-cell-id="c32"><g><rect x="506" y="266" width="450" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="506" y="284">保存の操作で、フォームの項目をまとめて保存する</text></g></g></g><g data-cell-id="c33"><g><rect x="16" y="300" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c34"><g><rect x="32" y="315" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="32" y="334">保存しました</text></g></g></g><g data-cell-id="c35"><g><rect x="16" y="362" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c36"><g><rect x="32" y="377" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D32424" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(211, 36, 36);"><text x="32" y="396">失敗</text></g></g></g><g data-cell-id="c37"><g><rect x="166" y="378" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="166" y="396">サーバーの値へ戻す</text></g></g></g><g data-cell-id="c38"><g><rect x="16" y="424" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c39"><g><rect x="32" y="439" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B45309" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(180, 83, 9);"><text x="32" y="458">結果が不明</text></g></g></g><g data-cell-id="c40"><g><rect x="166" y="440" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="166" y="458">戻さない。「確認する」</text></g></g></g><g data-cell-id="c41"><g><rect x="16" y="486" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c42"><g><rect x="32" y="501" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B45309" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(180, 83, 9);"><text x="32" y="520">権限不足</text></g></g></g><g data-cell-id="c43"><g><rect x="166" y="502" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="166" y="520">戻して、権限を取り直す</text></g></g></g><g data-cell-id="c44"><g><rect x="506" y="300" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c45"><g><rect x="522" y="315" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="522" y="334">保存しました</text></g></g></g><g data-cell-id="c46"><g><rect x="506" y="362" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c47"><g><rect x="522" y="377" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D32424" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(211, 36, 36);"><text x="522" y="396">失敗</text></g></g></g><g data-cell-id="c48"><g><rect x="656" y="378" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="656" y="396">入力した内容を残す</text></g></g></g><g data-cell-id="c49"><g><rect x="506" y="424" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c50"><g><rect x="522" y="439" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B45309" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(180, 83, 9);"><text x="522" y="458">結果が不明</text></g></g></g><g data-cell-id="c51"><g><rect x="656" y="440" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="656" y="458">入力を残し「確認する」</text></g></g></g><g data-cell-id="c52"><g><rect x="506" y="486" width="450" height="52" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c53"><g><rect x="522" y="501" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B45309" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(180, 83, 9);"><text x="522" y="520">権限不足</text></g></g></g><g data-cell-id="c54"><g><rect x="656" y="502" width="284" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="656" y="520">閲覧だけに変え、理由を示す</text></g></g></g><g data-cell-id="c55"><g transform="translate(0.5,0.5)"><rect x="16" y="568" width="940" height="132" rx="14" ry="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(221, 244, 255); stroke: rgb(9, 105, 218);"/></g></g><g data-cell-id="c56"><g><rect x="40" y="584" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="40" y="604">保存の単位ごとに状態を持つ</text></g></g></g><g data-cell-id="c57"><g><rect x="40" y="614" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="40" y="632">ある単位の保存は、ほかの単位の未保存の変更を解除しない。未保存の変更があるまま移動する前に確かめる。</text></g></g></g><g data-cell-id="c58"><g><rect x="40" y="638" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="40" y="656">同じ項目の連続した変更では、最後の要求の応答だけを反映する。古い応答で新しい値を上書きしない。</text></g></g></g><g data-cell-id="c59"><g><rect x="40" y="662" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="40" y="680">アカウント、ワークスペース、権限が変わった後と、画面を離れた後に届いた応答は反映しない（A → B → A も同じ）。</text></g></g></g></g></g></g></svg>