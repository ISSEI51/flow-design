er-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="38" y="190">セッションの管理</text></g></g></g><g data-cell-id="c8"><g><rect x="38" y="196" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="38" y="214">操作している人を特定する</text></g></g></g><g data-cell-id="c9"><g><path d="M 302 141 L 329.82 141" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 338.32 141 L 329.82 143.83 L 329.82 138.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="346" y="16" width="280" height="250" rx="14" ry="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(221, 244, 255); stroke: rgb(9, 105, 218);"/></g></g><g data-cell-id="c11"><g><rect x="368" y="34" width="40" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(9, 105, 218);"><text x="368" y="53">2</text></g></g></g><g data-cell-id="c12"><g><rect x="368" y="56" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(31, 35, 40);"><text x="368" y="78">認可と契約プラン</text></g></g></g><g data-cell-id="c13"><g><rect x="368" y="84" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(89, 99, 110);"><text x="368" y="101">Authorization・Entitlement</text></g></g></g><g data-cell-id="c14"><g><rect x="368" y="112" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="368" y="131">許可を決める（バックエンド）</text></g></g></g><g data-cell-id="c15"><g><rect x="368" y="148" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="368" y="166">アカウントとワークスペースの</text></g></g></g><g data-cell-id="c16"><g><rect x="368" y="172" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="368" y="190">スコープを照合する</text></g></g></g><g data-cell-id="c17"><g><rect x="368" y="196" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="368" y="214">受け付けた時点の権限で判断する</text></g></g></g><g data-cell-id="c18"><g><rect x="368" y="220" width="236" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="368" y="238">閲覧できないデータを送らない</text></g></g></g><g data-cell-id="c19"><g><path d="M 632 141 L 659.82 141" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 668.32 141 L 659.82 143.83 L 659.82 138.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c20"><g><rect x="676" y="16" width="280" height="250" rx="14" ry="14" fill=