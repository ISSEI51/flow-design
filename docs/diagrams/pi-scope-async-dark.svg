g><g data-cell-id="c42"><g><rect x="426" y="404" width="280" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c43"><g><rect x="434" y="419" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="566" y="439">Snapshot／描画の世代で照合</text></g></g></g><g data-cell-id="c44"><g><rect x="434" y="445" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="566" y="464">現在の世代と比べる</text></g></g></g><g data-cell-id="c45"><g><path d="M 302 442 L 409.82 442" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 418.32 442 L 409.82 444.83 L 409.82 439.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c46"><g><rect x="296" y="416" width="130" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="361" y="434">開始を要求</text></g></g></g><g data-cell-id="c47"><g><rect x="836" y="404" width="280" height="76" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c48"><g><rect x="844" y="419" width="264" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="976" y="439">拒否する</text></g></g></g><g data-cell-id="c49"><g><rect x="