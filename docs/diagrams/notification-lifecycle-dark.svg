ts="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c29"><g><path d="M 916 105 L 921.82 105" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 930.32 105 L 921.82 107.83 L 921.82 102.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c30"><g transform="translate(0.5,0.5)"><path d="M 20 170 L 540 170" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c31"><g><rect x="16" y="178" width="528" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="280" y="196">製品のサーバー（通知の配信の基盤）</text></g></g></g><g data-cell-id="c32"><g transform="translate(0.5,0.5)"><path d="M 572 170 L 724 170" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c33"><g><rect x="568" y="178" width="160" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="648" y="196">事業者・OS</text></g></g></g><g data-cell-id="c34"><g transform="translate(0.5,0.5)"><path d="M 756 170 L 908 170" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c35"><g><rect x="752" y="178" width="160" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="832" y="196">画面（閲覧）</text></g></g></g><g data-cell-id="c36"><g transform="translate(0.5,0.5)"><path d="M 940 170 L 1092 170" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c37"><g><rect x="936" y="178" width="160" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="1016" y="196">業務の画面</text></g></g></g><g data-cell-id="c38"><g><rect x="16" y="16" width="900" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="16" y="36">通知の状態（生成済み、送信済み、配信済み、既読、業務の対応完了）を区別する</text></g></g></g><g data-cell-id="c39"><g><path d="M 280 218 L 280 234 Q 280 244 290 244 L 638 244 Q 648 244 648 236.09 L 648 228.18" fill="none" stroke="#b45309" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(210, 153, 34);"/><path d="M 648 219.68 L 650.83 228.18 L 645.17 228.18 Z" fill="#b45309" stroke="#b45309" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(210, 153, 34); stroke: rgb(210, 153, 34);"/></g></g><g data-cell-id="c40"><g><rect x="254" y="252" width="420" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#B45309" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(210, 153, 34);"><text x="464" y="270">緊急の通知は、Quiet Hours と Digest で遅らせない</text></g></g></g><g data-cell-id="c41"><g transform="translate(0.5,0.5)"><path d="M 16 298 L 1096 298" fill="none" stroke="#8c959f" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c42"><g><rect x="16" y="310" width="150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="16" y="329">アプリ内</text></g></g></g><g data-cell-id="c43"><g><rect x="176" y="310" width="920" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="176" y="329">一覧で取得できた時点で配信済み。開くか既読の操作で既読</text></g></g></g><g data-cell-id="c44"><g transform="translate(0.5,0.5)"><path d="M 16 342 L 1096 342" fill="none" stroke="#8c959f" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c45"><g><rect x="16" y="354" width="150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="16" y="373">メール</text></g></g></g><g data-cell-id="c46"><g><rect x="176" y="354" width="920" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="176" y="373">送信済みまでしか確かめられないことが多い。開封を既読として扱わない</text></g></g></g><g data-cell-id="c47"><g transform="translate(0.5,0.5)"><path d="M 16 386 L 1096 386" fill="none" stroke="#8c959f" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c48"><g><rect x="16" y="398" width="150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="16" y="417">プッシュ通知</text></g></g></g><g data-cell-id="c49"><g><rect x="176" y="398" width="920" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="176" y="417">OS・ブラウザの許可が必要（製品の配信の設定とは別）。配信の確認を待つ</text></g></g></g><g data-cell-id="c50"><g><rect x="16" y="454" width="1080" height="56" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c51"><g><rect x="40" y="471" width="1032" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="490">確認できない状態を推測しない。送信済みを配信済みや既読として示さない</text></g></g></g></g></g></g></svg>