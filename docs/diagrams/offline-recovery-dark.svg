の応答（reportReachable）</text></g></g></g><g data-cell-id="c28"><g><path d="M 490 149 L 304.18 149" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 295.68 149 L 304.18 146.17 L 304.18 151.83 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c29"><g><rect x="282" y="157" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="392" y="175">probe がない場合：要求が</text></g></g></g><g data-cell-id="c30"><g><rect x="282" y="176" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="392" y="194">通信の失敗（reportFailure）</text></g></g></g><g data-cell-id="c31"><g><path d="M 152 190 L 152 369.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 152 378.32 L 149.17 369.82 L 154.83 369.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c32"><g><rect x="162" y="275" width="120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="162" y="293">ブラウザが</text></g></g></g><g data-cell-id="c33"><g><rect x="162" y="294" width="120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="162" y="312">offline</text></g></g></g><g data-cell-id="c34"><g><path d="M 248 190 L 248 336 Q 248 346 258 346 L 526 346 Q 536 346 536 356 L 536 369.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 536 378.32 L 533.17 369.82 L 538.83 369.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c35"><g><rect x="312" y="320" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="412" y="338">最初の疎通の確認に失敗</text></g></g></g><g data-cell-id="c36"><g><path d="M 294 435 L 479.82 435" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 488.32 435 L 479.82 437.83 L 479.82 432.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c37"><g><rect x="272" y="443" width="240" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="392" y="461">ブラウザが online</text></g></g></g><g data-cell-id="c38"><g><rect x="272" y="462" width="240" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="392" y="480">（online だけでは接続としない）</text></g></g></g><g data-cell-id="c39"><g><path d="M 602 190 L 602 369.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 602 378.32 L 599.17 369.82 L 604.83 369.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c40"><g><rect x="452" y="245" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="522" y="263">要求が</text></g></g></g><g data-cell-id="c41"><g><rect x="452" y="264" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="522" y="282">通信の失敗</text></g></g></g><g data-cell-id="c42"><g><rect x="452" y="283" width="140" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="522" y="301">（reportFailure）</text></g></g></g><g data-cell-id="c43"><g><path d="M 662 380 L 662 200.18" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 662 191.68 L 664.83 200.18 L 659.17 200.18 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c44"><g><rect x="667" y="255" width="130" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="732" y="273">疎通の確認が成功</text></g></g></g><g data-cell-id="c45"><g><rect x="667" y="274" width="130" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="732" y="292">または要求の応答</text></g></g></g><g data-cell-id="c46"><g><path d="M 774 421 L 959.82 421" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 968.32 421 L 959.82 423.83 L 959.82 418.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c47"><g><rect x="772" y="377" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="395">自動の確認の上限</text></g></g></g><g data-cell-id="c48"><g><path d="M 970 449 L 784.18 449" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 775.68 449 L 784.18 446.17 L 784.18 451.83 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c49"><g><rect x="772" y="457" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="475">「再接続を試す」（check）</text></g></g></g><g data-cell-id="c50"><g><path d="M 774 121 L 959.82 121" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 968.32 121 L 959.82 123.83 L 959.82 118.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c51"><g><rect x="762" y="77" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="95">切断の後に接続した</text></g></g></g><g data-cell-id="c52"><g><rect x="762" y="96" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="114">（lastOutage が変わる）</text></g></g></g><g data-cell-id="c53"><g><path d="M 970 149 L 784.18 149" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 775.68 149 L 784.18 146.17 L 784.18 151.83 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c54"><g><rect x="762" y="157" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="175">確認が終わる（表示した</text></g></g></g><g data-cell-id="c55"><g><rect x="762" y="176" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="872" y="194">問題だけ、復旧を知らせる）</text></g></g></g><g data-cell-id="c56"><g><rect x="16" y="16" width="1200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="16" y="35">実線の箱：useConnectivity の状態。点線の箱：製品が管理する状態（再取得、結果が不明な保存の確認）</text></g></g></g><g data-cell-id="c57"><g><rect x="16" y="534" width="1232" height="146" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c58"><g><rect x="40" y="550" width="1150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="569">どの状態でも、ブラウザが offline になったら、すぐにオフライン（browser）にする。操作の制限もすぐに行う</text></g></g></g><g data-cell-id="c59"><g><rect x="40" y="580" width="1150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="599">Banner の表示と読み上げは、1 秒続いてから（短時間の切断と繰り返しでは出さない）。接続の回復とデータの取得の成功を区別する</text></g></g></g><g data-cell-id="c60"><g><rect x="40" y="610" width="1150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="629">probe（疎通の確認）がない場合は、ブラウザが online になると未確認に戻り、次の要求の応答で接続になる</text></g></g></g><g data-cell-id="c61"><g><rect x="40" y="640" width="1150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="659">接続の回復の後も、結果が不明な更新は自動で再実行しない（取得の再開と更新の再実行を区別する）</text></g></g></g></g></g></g></svg>