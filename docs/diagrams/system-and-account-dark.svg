接続、障害、メンテナンス、結果不明、長時間の処理。影響のない機能を止めない</text></g></g></g><g data-cell-id="c35"><g transform="translate(0.5,0.5)"><path d="M 52 148 L 52 324" fill="none" stroke="#0969da" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c36"><g><ellipse cx="52" cy="324" rx="4" ry="4" fill="#0969da" stroke="#0969da" stroke-width="2" pointer-events="all" style="fill: rgb(68, 147, 248); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c37"><g><rect x="66" y="274" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="66" y="292">3 つの段階と Notifications の</text></g></g></g><g data-cell-id="c38"><g><rect x="66" y="296" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="66" y="314">すべてに適用する</text></g></g></g><g data-cell-id="c39"><g><rect x="16" y="556" width="940" height="112" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c40"><g><rect x="40" y="572" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="591">共通の状態（1 つの Boolean や 1 つの error にまとめない）</text></g></g></g><g data-cell-id="c41"><g><rect x="40" y="602" width="892" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="621">Authentication、Authorization、Entitlement、Scope、Connectivity、Service Health、</text></g></g></g><g data-cell-id="c42"><g><rect x="40" y="626" width="892" height