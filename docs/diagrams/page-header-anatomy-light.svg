-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="806" y="363">間は 32px。境界線と Card は使わない</text></g></g></g><g data-cell-id="c49"><g><rect x="16" y="386" width="400" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="16" y="405">狭い領域（タイトルに 20rem を残せない）</text></g></g></g><g data-cell-id="c50"><g transform="translate(0.5,0.5)"><rect x="16" y="416" width="300" height="170" rx="16" ry="16" fill="none" stroke="#8c959f" pointer-events="all" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c51"><g><rect x="40" y="442" width="200" height="18" rx="9" ry="9" fill="#1f2328" stroke="none" pointer-events="all" style="fill: rgb(31, 35, 40);"/></g></g><g data-cell-id="c52"><g><rect x="40" y="468" width="120" height="18" rx="9" ry="9" fill="#1f2328" stroke="none" pointer-events="all" style="fill: rgb(31, 35, 40);"/></g></g><g data-cell-id="c53"><g><rect x="40" y="506" width="100" height="32" rx="9" ry="9" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c54"><g><rect x="148" y="506" width="110" height="32" rx="9" ry="9" fill="#1f2328" stroke="none" pointer-events="all" style="fill: rgb(31, 35, 40);"/></g></g><g data-cell-id="c55"><g><rect x="346" y="442" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="346" y="461">タイトルが折り返し、操作はタイトルの下へ移る</text></g></g></g><g data-cell-id="c56"><g><rect x="346" y="464" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="346" y="483">操作は隠さない（機能を失わせない）</text></g></g></g><g data-cell-id="c57"><g><rect x="346" y="486" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="346" y="505">判断は画面の幅ではなく Page Header の領域の幅</text></g></g></g></g></g></g></svg>