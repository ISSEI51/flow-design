(230, 237, 243);"><text x="161" y="219">許可されるか</text></g></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><rect x="416" y="148" width="500" height="98" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c15"><g><rect x="424" y="163" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="666" y="183">表示して、操作できる</text></g></g></g><g data-cell-id="c16"><g><rect x="424" y="189" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="208">一時的な理由（障害、接続、処理中、</text></g></g></g><g data-cell-id="c17"><g><rect x="424" y="211" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="230">前提の設定）は、無効にして理由を示す</text></g></g></g><g data-cell-id="c18"><g><path d="M 312 197 L 399.82 197" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 408.32 197 L 399.82 199.83 L 399.82 194.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c19"><g><rect x="316" y="171" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="361" y="189">はい</text></g></g></g><g data-cell-id="c20"><g><path d="M 161 250 L 161 265.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 161 274.32 L 158.17 265.82 L 163.83 265.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c21"><g><rect x="170" y="252" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="170" y="270">いいえ</text></g></g></g><g data-cell-id="c22"><g><rect x="16" y="280" width="290" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c23"><g><rect x="32" y="317" width="258" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="161" y="339">存在を知らせてよいか</text></g></g></g><g data-cell-id="c24"><g transform="translate(0.5,0.5)"><rect x="416" y="280" width="500" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c25"><g><rect x="424" y="295" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="666" y="315">表示しない</text></g></g></g><g data-cell-id="c26"><g><rect x="424" y="321" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="340">件数、検索の候補、書き出し、</text></g></g></g><g data-cell-id="c27"><g><rect x="424" y="343" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="362">通知にも含めない</text></g></g></g><g data-cell-id="c28"><g><path d="M 312 329 L 399.82 329" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 408.32 329 L 399.82 331.83 L 399.82 326.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c29"><g><rect x="316" y="303" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="361" y="321">いいえ</text></g></g></g><g data-cell-id="c30"><g><path d="M 161 382 L 161 397.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 161 406.32 L 158.17 397.82 L 163.83 397.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c31"><g><rect x="170" y="384" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="170" y="402">はい</text></g></g></g><g data-cell-id="c32"><g><rect x="16" y="412" width="290" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c33"><g><rect x="32" y="449" width="258" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="161" y="471">利用者の業務に関係するか</text></g></g></g><g data-cell-id="c34"><g transform="translate(0.5,0.5)"><rect x="416" y="412" width="500" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c35"><g><rect x="424" y="427" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="666" y="447">表示しない</text></g></g></g><g data-cell-id="c36"><g><rect x="424" y="453" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="472">業務に関係のない管理の機能</text></g></g></g><g data-cell-id="c37"><g><rect x="424" y="475" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="494">（申請できる場合は、無効にして申請を示す）</text></g></g></g><g data-cell-id="c38"><g><path d="M 312 461 L 399.82 461" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 408.32 461 L 399.82 463.83 L 399.82 458.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c39"><g><rect x="316" y="435" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="361" y="453">いいえ</text></g></g></g><g data-cell-id="c40"><g><path d="M 161 514 L 161 529.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 161 538.32 L 158.17 529.82 L 163.83 529.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c41"><g><rect x="170" y="516" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="170" y="534">はい</text></g></g></g><g data-cell-id="c42"><g><rect x="16" y="544" width="290" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c43"><g><rect x="32" y="581" width="258" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="161" y="603">対象は閲覧できる内容か</text></g></g></g><g data-cell-id="c44"><g transform="translate(0.5,0.5)"><rect x="416" y="544" width="500" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" pointer-events="all" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c45"><g><rect x="424" y="559" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="666" y="579">閲覧専用</text></g></g></g><g data-cell-id="c46"><g><rect x="424" y="585" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="604">通常の文字で表示する</text></g></g></g><g data-cell-id="c47"><g><rect x="424" y="607" width="484" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="666" y="626">コピーが必要な値は Read Only の Input</text></g></g></g><g data-cell-id="c48"><g><path d="M 312 593 L 399.82 593" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 408.32 593 L 399.82 595.83 L 399.82 590.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c49"><g><rect x="316" y="567" width="90" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="361" y="585">はい</text></g></g></g><g data-cell-id="c50"><g><path d="M 161 646 L 161 671.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 161 680.32 L 158.17 671.82 L 163.83 671.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c51"><g><rect x="170" y="648" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="170" y="666">いいえ</text></g></g></g><g data-cell-id="c52"><g transform="translate(0.5,0.5)"><rect x="16" y="686" width="900" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" pointer-events="all" style="stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c53"><g><rect x="24" y="701" width="884" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="466" y="721">無効にして、操作の近くに理由を示す</text></g></g></g><g data-cell-id="c54"><g><rect x="24" y="727" width="884" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="466" y="746">理由は文で示し、aria-describedby で関連付ける（Tooltip だけにしない）</text></g></g></g><g data-cell-id="c55"><g><rect x="24" y="749" width="884" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="466" y="768">実際に使える解決の方法（申請、問い合わせ、設定への移動）だけを置く</text></g></g></g><g data-cell-id="c56"><g><rect x="16" y="820" width="900" height="56" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c57"><g><rect x="40" y="837" width="852" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="856">UI の非表示と無効化は、バックエンドでの認可の代わりにならない</text></g></g></g></g></g></g></svg>