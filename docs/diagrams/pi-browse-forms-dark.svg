" font-size="14px" style="fill: rgb(68, 147, 248);"><text x="46" y="582">3</text></g></g></g><g data-cell-id="c42"><g><rect x="74" y="566" width="1120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="74" y="585">保存で条件から外れた行は復元しない（同じ位置の行へ）</text></g></g></g><g data-cell-id="c43"><g><rect x="16" y="607" width="1200" height="42" rx="10" ry="10" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c44"><g><ellipse cx="46" cy="628" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c45"><g><rect x="34" y="616" width="24" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(68, 147, 248);"><text x="46" y="634">4</text></g></g></g><g data-cell-id="c46"><g><rect x="74" y="618" width="1120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="74" y="637">利用者が操作したら復元を取りやめる</text></g></g></g></g></g></g></svg>