<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1259px" height="649px" viewBox="0 0 1259 649"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="106" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c2"><g><rect x="24" y="121" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="126" y="141">接続</text></g></g></g><g data-cell-id="c3"><g><rect x="24" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="126" y="166">疎通を確認できた</text></g></g></g><g data-cell-id="c4"><g><rect x="24" y="169" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="126" y="188">通常の表示</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="336" y="106" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="#b45309" stroke-width="1.2" pointer-events="all" style="fill: rgb(246, 248, 250); stroke: rgb(180, 83, 9);"/></g></g><g data-cell-id="c6"><g><rect x="344" y="121" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="446" y="141">オフライン</text></g></g></g><g data-cell-id="c7"><g><rect x="344" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="446" y="166">既存のデータと取得時刻</text></g></g></g><g data-cell-id="c8"><g><rect x="344" y="169" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="446" y="188">登録・更新・削除を制限</text></g></g></g><g data-cell-id="c9"><g><rect x="656" y="106" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c10"><g><rect x="664" y="121" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="766" y="141">再接続中</text></g></g></g><g data-cell-id="c11"><g><rect x="664" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="766" y="166">疎通を確認している</text></g></g></g><g data-cell-id="c12"><g><rect x="664" y="169" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="766" y="188">保存を受け付けない</text></g></g></g><g data-cell-id="c13"><g><rect x="976" y="106" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c14"><g><rect x="984" y="121" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="1086" y="141">復旧を確認中</text></g></g></g><g data-cell-id="c15"><g><rect x="984" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="1086" y="166">再取得と</text></g></g></g><g data-cell-id="c16"><g><rect x="984" y="169" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="1086" y="188">保存の結果の確認</text></g></g></g><g data-cell-id="c17"><g><path d="M 242 155 L 319.82 155" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 328.32 155 L 319.82 157.83 L 319.82 152.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c18"><g><rect x="236" y="56" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="286" y="74">ブラウザが</text></g></g></g><g data-cell-id="c19"><g><rect x="236" y="75" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="286" y="93">offline</text></g></g></g><g data-cell-id="c20"><g><path d="M 562 155 L 639.82 155" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 648.32 155 L 639.82 157.83 L 639.82 152.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c21"><g><rect x="556" y="56" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="606" y="74">ブラウザが</text></g></g></g><g data-cell-id="c22"><g><rect x="556" y="75" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="606" y="93">online</text></g></g></g><g data-cell-id="c23"><g><path d="M 882 155 L 959.82 155" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 968.32 155 L 959.82 157.83 L 959.82 152.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c24"><g><rect x="876" y="56" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="926" y="74">疎通の確認が</text></g></g></g><g data-cell-id="c25"><g><rect x="876" y="75" width="100" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="926" y="93">成功</text></g></g></g><g data-cell-id="c26"><g><path d="M 1086 100 L 1086 52 Q 1086 42 1076 42 L 136 42 Q 126 42 126 52 L 126 89.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 126 98.32 L 123.17 89.82 L 128.83 89.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c27"><g><rect x="142" y="16" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="142" y="35">確認が終わったら接続に戻る（表示した問題だけ、復旧を知らせる）</text></g></g></g><g data-cell-id="c28"><g><path d="M 126 210 L 126 294 Q 126 304 136 304 L 596 304 Q 606 304 606 294 L 606 198 Q 606 188 616 188 L 639.82 188" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 648.32 188 L 639.82 190.83 L 639.82 185.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c29"><g><rect x="142" y="278" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="142" y="297">要求が通信の失敗で終わった</text></g></g></g><g data-cell-id="c30"><g transform="translate(0.5,0.5)"><rect x="656" y="384" width="220" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="3.6 3.6" pointer-events="all" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c31"><g><rect x="664" y="399" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="766" y="419">間隔を延ばして確認</text></g></g></g><g data-cell-id="c32"><g><rect x="664" y="425" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="766" y="444">1 秒、2 秒、4 秒…</text></g></g></g><g data-cell-id="c33"><g><rect x="664" y="447" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="766" y="466">読み上げは繰り返さない</text></g></g></g><g data-cell-id="c34"><g transform="translate(0.5,0.5)"><rect x="976" y="384" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="#b45309" stroke-width="1.2" pointer-events="all" style="fill: rgb(246, 248, 250); stroke: rgb(180, 83, 9);"/></g></g><g data-cell-id="c35"><g><rect x="984" y="399" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="1086" y="419">接続できない</text></g></g></g><g data-cell-id="c36"><g><rect x="984" y="425" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="1086" y="444">自動の確認の上限</text></g></g></g><g data-cell-id="c37"><g><rect x="984" y="447" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="1086" y="466">「再接続を試す」を待つ</text></g></g></g><g data-cell-id="c38"><g><path d="M 736 210 L 736 367.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 736 376.32 L 733.17 367.82 L 738.83 367.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c39"><g><rect x="636" y="284" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="676" y="302">失敗</text></g></g></g><g data-cell-id="c40"><g><path d="M 796 378 L 796 220.18" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 796 211.68 L 798.83 220.18 L 793.17 220.18 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c41"><g><rect x="816" y="284" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="856" y="302">再確認</text></g></g></g><g data-cell-id="c42"><g><path d="M 882 433 L 959.82 433" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 968.32 433 L 959.82 435.83 L 959.82 430.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c43"><g><rect x="886" y="389" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="926" y="407">上限</text></g></g></g><g data-cell-id="c44"><g><path d="M 1086 378 L 1086 369 Q 1086 360 1076 360 L 856 360 Q 846 360 846 350 L 846 220.18" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 846 211.68 L 848.83 220.18 L 843.17 220.18 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c45"><g><rect x="1106" y="328" width="120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(89, 99, 110);"><text x="1166" y="346">再接続を試す</text></g></g></g><g data-cell-id="c46"><g><rect x="16" y="532" width="1180" height="84" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c47"><g><rect x="40" y="548" width="1120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="40" y="567">操作の制限はすぐに行う。Banner の表示と読み上げは、1 秒続いてから（短時間の切断と繰り返しでは出さない）</text></g></g></g><g data-cell-id="c48"><g><rect x="40" y="578" width="1120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="40" y="597">ブラウザの online だけで接続とせず、接続の回復とデータの取得の成功を区別する</text></g></g></g></g></g></g></svg>