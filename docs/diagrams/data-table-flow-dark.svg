g data-cell-id="c28"><g><rect x="16" y="274" width="560" height="104" rx="14" ry="14" fill="#ddf4ff" stroke="none" pointer-events="all" style="fill: rgb(18, 29, 47);"/></g></g><g data-cell-id="c29"><g><rect x="40" y="294" width="520" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="40" y="316">選択は行の ID で保持する</text></g></g></g><g data-cell-id="c30"><g><rect x="40" y="326" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="345">並べ替え、絞り込み、ページ移動の後も同じ行が選ばれたまま</text></g></g></g><g data-cell-id="c31"><g><rect x="40" y="350" width="520" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="369">表示していない行の選択は、件数で示す</text></g></g></g><g data-cell-id="c32"><g><rect x="600" y="274" width="316" height="104" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c33"><g><rect x="624" y="294" width="280" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="624" y="316">一括操作</text></g></g></g><g data-cell-id="c34"><g><rect x="624" y="326" width="280" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="624" y="345">1 件以上選んだときだけ表示</text></g></g></g><g data-cell-id="c35"><g><rect x="624" y="350" width="280" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="624" y="369">危険な操作は確認してから行う</text></g></g></g><g data-cell-id="c36"><g><path d="M 578 326 L 587.82 326" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 596.32 326 L 587.82 328.83 L 587.82 323.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g></g></g></g></svg>