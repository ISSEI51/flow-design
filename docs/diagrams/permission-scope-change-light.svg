t="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="146" y="458">サーバーからの通知、</text></g></g></g><g data-cell-id="c30"><g><rect x="24" y="461" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="146" y="480">定期的な確認（製品）</text></g></g></g><g data-cell-id="c31"><g transform="translate(0.5,0.5)"><rect x="336" y="398" width="260" height="98" rx="12" ry="12" fill="none" stroke="#8c959f" stroke-width="1.2" pointer-events="all" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c32"><g><rect x="344" y="413" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="466" y="433">再確認中</text></g></g></g><g data-cell-id="c33"><g><rect x="344" y="439" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="466" y="458">表示は前の権限のまま</text></g></g></g><g data-cell-id="c34"><g><rect x="344" y="461" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="466" y="480">操作は許可しない</text></g></g></g><g data-cell-id="c35"><g transform="translate(0.5,0.5)"><rect x="656" y="398" width="260" height="98" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(221, 244, 255); stroke: rgb(9, 105, 218);"/></g></g><g data-cell-id="c36"><g><rect x="664" y="413" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="786" y="433">確定</text></g></g></g><g data-cell-id="c37"><g><rect x="664" y="439" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="786" y="458">表示と操作を更新する</text></g></g></g><g data-cell-id="c38"><g><rect x="664" y="461" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="786" y="480">再ログインを求めない</text></g></g></g><g data-cell-id="c39"><g><path d="M 282 447 L 319.82 447" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 328.32 447 L 319.82 449.83 L 319.82 444.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c40"><g><path d="M 602 447 L 639.82 447" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 648.32 447 L 639.82 449.83 L 639.82 444.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c41"><g><path d="M 786 502 L 786 526" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c42"><g><path d="M 146 526 L 786 526" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c43"><g><path d="M 146 526 L 146 531.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 146 540.32 L 143.17 531.82 L 148.83 531.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c44"><g><rect x="16" y="546" width="260" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c45"><g><rect x="24" y="561" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="146" y="581">編集の権限を失った</text></g></g></g><g data-cell-id="c46"><g><rect x="24" y="587" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="146" y="606">保存を停止し、閲覧専用にする</text></g></g></g><g data-cell-id="c47"><g><rect x="24" y="609" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="146" y="628">入力はポリシーが許す場合だけ保持</text></g></g></g><g data-cell-id="c48"><g><path d="M 466 526 L 466 531.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 466 540.32 L 463.17 531.82 L 468.83 531.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c49"><g><rect x="336" y="546" width="260" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c50"><g><rect x="344" y="561" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="466" y="581">閲覧の権限も失った</text></g></g></g><g data-cell-id="c51"><g><rect x="344" y="587" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="466" y="606">内容と入力を表示しない</text></g></g></g><g data-cell-id="c52"><g><rect x="344" y="609" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="466" y="628">理由は内容を含まない文で伝える</text></g></g></g><g data-cell-id="c53"><g><path d="M 786 526 L 786 531.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(140, 149, 159);"/><path d="M 786 540.32 L 783.17 531.82 L 788.83 531.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(140, 149, 159); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="c54"><g><rect x="656" y="546" width="260" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c55"><g><rect x="664" y="561" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(31, 35, 40);"><text x="786" y="581">権限が戻った</text></g></g></g><g data-cell-id="c56"><g><rect x="664" y="587" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="786" y="606">最新の内容と権限を</text></g></g></g><g data-cell-id="c57"><g><rect x="664" y="609" width="244" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(89, 99, 110);"><text x="786" y="628">確かめてから再開する</text></g></g></g><g data-cell-id="c58"><g><rect x="16" y="680" width="900" height="56" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(246, 248, 250);"/></g></g><g data-cell-id="c59"><g><rect x="40" y="697" width="852" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(31, 35, 40);"><text x="40" y="716">保存中に権限が変わった場合は、サーバーの実際の結果を示す（成功と推測しない）</text></g></g></g></g></g></g></svg>