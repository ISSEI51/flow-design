<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="929px" height="632px" viewBox="0 0 929 632"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="146" y="24" width="360" height="176" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c2"><g><rect x="154" y="67" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="326" y="87">通知センター＋メール</text></g></g></g><g data-cell-id="c3"><g><rect x="154" y="93" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="112">後から確かめれば足りる</text></g></g></g><g data-cell-id="c4"><g><rect x="154" y="115" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="134">対象の画面の Alert に残す</text></g></g></g><g data-cell-id="c5"><g><rect x="154" y="137" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="156">例：契約の更新のリマインダー</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="526" y="24" width="360" height="176" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c7"><g><rect x="534" y="67" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="706" y="87">Dialog・Banner・Push</text></g></g></g><g data-cell-id="c8"><g><rect x="534" y="93" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="112">すぐの判断や対応が不可欠な場合だけ</text></g></g></g><g data-cell-id="c9"><g><rect x="534" y="115" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="134">広い範囲：Banner（System States）</text></g></g></g><g data-cell-id="c10"><g><rect x="534" y="137" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="156">例：新しい端末からのログイン</text></g></g></g><g data-cell-id="c11"><g><rect x="146" y="220" width="360" height="176" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c12"><g><rect x="154" y="263" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="326" y="283">通知センター・Digest</text></g></g></g><g data-cell-id="c13"><g><rect x="154" y="289" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="308">まとめて確かめれば足りる</text></g></g></g><g data-cell-id="c14"><g><rect x="154" y="311" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="330">知らせる必要がなければ履歴だけ</text></g></g></g><g data-cell-id="c15"><g><rect x="154" y="333" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="326" y="352">例：新しい機能のお知らせ</text></g></g></g><g data-cell-id="c16"><g><rect x="526" y="220" width="360" height="176" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c17"><g><rect x="534" y="263" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="706" y="283">Inline Feedback・Toast</text></g></g></g><g data-cell-id="c18"><g><rect x="534" y="289" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="308">操作に直接関係する一時的な結果</text></g></g></g><g data-cell-id="c19"><g><rect x="534" y="311" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="330">結果が画面に表れない操作だけ Toast</text></g></g></g><g data-cell-id="c20"><g><rect x="534" y="333" width="344" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="706" y="352">例：メモを保存しました</text></g></g></g><g data-cell-id="c21"><g><path d="M 116 396 L 116 34.18" fill="none" stroke="#59636e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/><path d="M 116 25.68 L 118.83 34.18 L 113.17 34.18 Z" fill="#59636e" stroke="#59636e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(145, 152, 161); stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c22"><g><rect x="16" y="28" width="88" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="104" y="47">重要度 高</text></g></g></g><g data-cell-id="c23"><g><rect x="16" y="372" width="88" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="end" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="104" y="391">重要度 低</text></g></g></g><g data-cell-id="c24"><g><path d="M 146 426 L 875.82 426" fill="none" stroke="#59636e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/><path d="M 884.32 426 L 875.82 428.83 L 875.82 423.17 Z" fill="#59636e" stroke="#59636e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(145, 152, 161); stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c25"><g><rect x="146" y="438" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="146" y="457">緊急性 低</text></g></g></g><g data-cell-id="c26"><g><rect x="686" y="438" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="886" y="457">緊急性 高</text></g></g></g><g data-cell-id="c27"><g><rect x="16" y="486" width="870" height="112" rx="14" ry="14" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c28"><g><rect x="40" y="504" width="822" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(230, 237, 243);"><text x="40" y="523">重要度と緊急性は別々に持ち、具体的な値は製品が定義する</text></g></g></g><g data-cell-id="c29"><g><rect x="40" y="532" width="822" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="551">重要だというだけで Dialog にしない。部分的な失敗、重大なエラー、結果の不明を Toast だけにしない</text></g></g></g><g data-cell-id="c30"><g><rect x="40" y="556" width="822" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="40" y="575">同じ情報を、すべての方法で重複して知らせない</text></g></g></g></g></g></g></svg>