<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="990px" height="594px" viewBox="0 0 990 594"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c1"><g><rect x="16" y="16" width="940" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="16" y="38">設定の適用範囲</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="16" y="56" width="220" height="132" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c3"><g><rect x="24" y="77" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="126" y="97">個人の設定</text></g></g></g><g data-cell-id="c4"><g><rect x="24" y="103" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="126" y="122">アカウントに保存する</text></g></g></g><g data-cell-id="c5"><g><rect x="24" y="125" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="126" y="144">どの端末でも同じ</text></g></g></g><g data-cell-id="c6"><g><rect x="24" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="126" y="166">プロフィール、表示と言語</text></g></g></g><g data-cell-id="c7"><g><rect x="256" y="56" width="220" height="132" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c8"><g><rect x="264" y="77" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="366" y="97">組織の設定</text></g></g></g><g data-cell-id="c9"><g><rect x="264" y="103" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="366" y="122">ワークスペースに保存する</text></g></g></g><g data-cell-id="c10"><g><rect x="264" y="125" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="366" y="144">すべてのメンバーに適用</text></g></g></g><g data-cell-id="c11"><g><rect x="264" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="366" y="166">組織の情報、ポリシー</text></g></g></g><g data-cell-id="c12"><g><rect x="496" y="56" width="220" height="132" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c13"><g><rect x="504" y="77" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="606" y="97">この端末だけの設定</text></g></g></g><g data-cell-id="c14"><g><rect x="504" y="103" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="606" y="122">端末のブラウザに保存する</text></g></g></g><g data-cell-id="c15"><g><rect x="504" y="125" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="606" y="144">ほかの端末に影響しない</text></g></g></g><g data-cell-id="c16"><g><rect x="504" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="606" y="166">表の行の高さなど</text></g></g></g><g data-cell-id="c17"><g><rect x="736" y="56" width="220" height="132" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c18"><g><rect x="744" y="77" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="846" y="97">機能の設定</text></g></g></g><g data-cell-id="c19"><g><rect x="744" y="103" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="846" y="122">機能に固有の設定</text></g></g></g><g data-cell-id="c20"><g><rect x="744" y="125" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="846" y="144">その機能の近くに置く</text></g></g></g><g data-cell-id="c21"><g><rect x="744" y="147" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="846" y="166">一覧の表示の項目など</text></g></g></g><g data-cell-id="c22"><g><rect x="16" y="204" width="940" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="16" y="222">設定の画面のカテゴリの一覧と見出しに、対象（佐藤 花子さん、本社営業部）を示す。すべての設定を 1 つの画面に集めない。</text></g></g></g><g data-cell-id="c23"><g><rect x="16" y="266" width="940" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(230, 237, 243);"><text x="16" y="288">値の決まり方（左ほど優先し、値がない場合だけ右の値を使う）</text></g></g></g><g data-cell-id="c24"><g><rect x="16" y="306" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c25"><g><rect x="24" y="321" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="126" y="341">組織のポリシー</text></g></g></g><g data-cell-id="c26"><g><rect x="24" y="347" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="126" y="366">必須。個人の設定で</text></g></g></g><g data-cell-id="c27"><g><rect x="24" y="369" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="126" y="388">無効にできない</text></g></g></g><g data-cell-id="c28"><g><path d="M 238 355 L 243.82 355" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 252.32 355 L 243.82 357.83 L 243.82 352.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c29"><g><rect x="256" y="306" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c30"><g><rect x="264" y="321" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="366" y="341">個人の上書き</text></g></g></g><g data-cell-id="c31"><g><rect x="264" y="347" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="366" y="366">利用者が選んだ値</text></g></g></g><g data-cell-id="c32"><g><rect x="264" y="369" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="366" y="388">ポリシーの間も保持</text></g></g></g><g data-cell-id="c33"><g><path d="M 478 355 L 483.82 355" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 492.32 355 L 483.82 357.83 L 483.82 352.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c34"><g><rect x="496" y="306" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c35"><g><rect x="504" y="321" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="606" y="341">組織の標準</text></g></g></g><g data-cell-id="c36"><g><rect x="504" y="347" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="606" y="366">上書きしていない</text></g></g></g><g data-cell-id="c37"><g><rect x="504" y="369" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="606" y="388">メンバーに使う</text></g></g></g><g data-cell-id="c38"><g><path d="M 718 355 L 723.82 355" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 732.32 355 L 723.82 357.83 L 723.82 352.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c39"><g><rect x="736" y="306" width="220" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c40"><g><rect x="744" y="321" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="846" y="341">製品の標準</text></g></g></g><g data-cell-id="c41"><g><rect x="744" y="347" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="846" y="366">組織が決めていない</text></g></g></g><g data-cell-id="c42"><g><rect x="744" y="369" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="846" y="388">場合の初期値</text></g></g></g><g data-cell-id="c43"><g transform="translate(0.5,0.5)"><path d="M 126 404 L 126 434" fill="none" stroke="#57606a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c44"><g transform="translate(0.5,0.5)"><path d="M 366 404 L 366 434" fill="none" stroke="#57606a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c45"><g transform="translate(0.5,0.5)"><path d="M 606 404 L 606 434" fill="none" stroke="#57606a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c46"><g transform="translate(0.5,0.5)"><path d="M 846 404 L 846 434" fill="none" stroke="#57606a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c47"><g transform="translate(0.5,0.5)"><path d="M 126 434 L 846 434" fill="none" stroke="#57606a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(145, 152, 161);"/></g></g><g data-cell-id="c48"><g><path d="M 486 434 L 486 443.82" fill="none" stroke="#0969da" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 147, 248);"/><path d="M 486 452.32 L 483.17 443.82 L 488.83 443.82 Z" fill="#0969da" stroke="#0969da" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 147, 248); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c49"><g transform="translate(0.5,0.5)"><rect x="96" y="456" width="780" height="104" rx="14" ry="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c50"><g><rect x="120" y="472" width="732" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="486" y="492">実際に有効な値と、その出所を示す</text></g></g></g><g data-cell-id="c51"><g><rect x="120" y="500" width="732" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="486" y="518">例：「組織の標準（日本語）を使っています」「組織のポリシーで必須のため、無効にできません」</text></g></g></g><g data-cell-id="c52"><g><rect x="120" y="524" width="732" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="486" y="542">変更できない場合は理由を示す（ポリシー → 契約プラン → 権限の順）</text></g></g></g></g></g></g></svg>