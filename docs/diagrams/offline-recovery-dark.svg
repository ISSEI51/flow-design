ents="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="152" y="421">オフライン</text></g></g></g><g data-cell-id="c15"><g><rect x="24" y="427" width="256" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="152" y="446">offline（reason: browser）</text></g></g></g><g data-cell-id="c16"><g><rect x="24" y="449" width="256" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="152" y="468">登録・更新・削除を制限</text></g></g></g><g data-cell-id="c17"><g><rect x="496" y="386" width="272" height="98" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c18"><g><rect x="504" y="401" width="256" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="632" y="421">再接続中（connecting）</text></g></g></g><g data-cell-id="c19"><g><rect x="504" y="427" width="256" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="632" y="446">疎通を確認している</text></g></g></g><g data-cell-id="c20"><g><rect x="504" y="449" width="256" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="632" y="468">間隔を延ばして再確認</text></g></g></g><g data-cell-id="c21"><g transform="translate(0.5,0.5)"><rect x="976" y="386" width="272" height="98" rx="12" ry="12" fill="#f6f8fa" 