: rgb(110, 118, 129);"/><path d="M 528.32 143 L 519.82 145.83 L 519.82 140.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c22"><g><rect x="466" y="113" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="501" y="131">できない</text></g></g></g><g data-cell-id="c23"><g><path d="M 762 143 L 809.82 143" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 818.32 143 L 809.82 145.83 L 809.82 140.17 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c24"><g><rect x="756" y="113" width="70" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="791" y="131">ログイン</text></g></g></g><g data-cell-id="c25"><g><path d="M 371 66 L 371 52 Q 371 42 361 42 L 121 42 Q 111 42 111 48.91 L 111 55.82" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(110, 118, 129);"/><path d="M 111 64.32 L 108.17 55.82 L 113.83 55.82 Z" fill="#8c959f" stroke="#8c959f" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(110, 118, 129); stroke: rgb(110, 118, 129);"/></g></g><g data-cell-id="c26"><g><rect x="91" y="16" width="300" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(145, 152, 161);"><text x="241" y="34">できる：利用者に知らせずに更新</text></g></g></g><g data-cell-id="c27"><g transform="translate(0.5,0.5)"><rect x="826" y="294" width="190" height="142" rx="12" ry="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2" pointer-events="all" style="fill: rgb(18, 29, 47); stroke: rgb(68, 147, 248);"/></g></g><g data-cell-id="c28"><g><rect x="834" y="309" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: rgb(230, 237, 243);"><text x="921" y="329">同じ利用者</text></g></g></g><g data-cell-id="c29"><g><rect x="834" y="335" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="921" y="354">権限で許される</text></g></g></g><g data-cell-id="c30"><g><rect x="834" y="357" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="921" y="376">作業だけ復元</text></g></g></g><g data-cell-id="c31"><g><rect x="834" y="379" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="921" y="398">結果が不明な保存は</text></g></g></g><g data-cell-id="c32"><g><rect x="834" y="401" width="174" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59636E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(145, 152, 161);"><text x="921" y="420">再送信せず確かめる</text></g></g></g><g data-cell-id="c33"><g><rect x="536" y="294" width="220" height="142" rx="12" ry="12" fill="#f6f8fa" stroke="none" pointer-events="all" style="fill: rgb(22, 27, 34);"/></g></g><g data-cell-id="c34"><g><rect x="544" y="309" width="204" height="20" fill="none" stroke="none" pointer-events="all"/></g